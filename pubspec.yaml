name: ppc_timeclock
description: Paragon GPS Time Clock — silent geofence punch.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  #  THE CLOCK
  #
  #  Wraps the operating system's OWN geofencing — GeofencingClient on Android,
  #  CLLocationManager region monitoring on iOS. The fence is handed to the OS,
  #  and the OS starts this app when it is crossed. Works with the app
  #  terminated; re-registers itself after a reboot.
  #
  #  This replaces flutter_background_geolocation, which ran its own tracking
  #  engine inside this app's process and therefore needed the process to stay
  #  alive. It did not: on 29 July the app went silent at 07:22 and no exit was
  #  ever recorded. Every fix we tried — wider radius, heartbeat, foreground
  #  service, battery exemption — was an attempt to keep alive a process Android
  #  had already decided to kill. The OS was never going to lose that argument.
  #
  #  MIT licensed, which also removes the per-app licence fee that would have
  #  applied to the old library on iOS.
  native_geofence: ^1.2.2

  # Periodic backstop, in case a fence event is genuinely lost. Secondary now —
  # the fences are the mechanism, this is the check on them.
  background_fetch: ^1.3.0

  # Single position reads for that backstop and for the "where am I?" check when
  # the app is opened. Deliberately a plain position reader with no background
  # engine of its own — that was the old mistake.
  geolocator: ^14.0.0

  # Runtime permissions: location, location-always, notifications, and the
  # battery-optimisation exemption. native_geofence deliberately does not handle
  # permissions and its own docs point here.
  permission_handler: ^11.3.0

  # Supabase client for inserting punches.
  supabase_flutter: ^2.5.0

  # Local offline queue.
  shared_preferences: ^2.2.0
  connectivity_plus: ^6.0.0

  # Tells each person when they have been clocked in or out.
  #
  # Requires core library desugaring, which the build workflow enables. Getting
  # that right means adding ONLY the desugaring flag and library — the Flutter
  # scaffold already has Java and Kotlin consistently on 17, and overriding
  # either half is what cost builds #58 and #59.
  flutter_local_notifications: ^17.2.2

  # Reads the connected Wi-Fi SSID. Second presence signal: inside a steel
  # building GPS can read as "off site" while the person is standing in the
  # shop, and being joined to the shop network proves otherwise at no battery
  # cost. Fails soft to "no opinion" — see Presence.onShopWifi().
  network_info_plus: ^5.0.0

dev_dependencies:
  # Generates the Android launcher icon (black PPC shield) at build time.
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Black PPC shield launcher icon. Regenerated in CI before the APK build.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
