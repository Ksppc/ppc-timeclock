name: ppc_timeclock
description: Paragon GPS Time Clock — silent geofence punch (Android beta).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Robust background geofencing (enter/exit even when app is killed).
  flutter_background_geolocation: ^4.16.0
  # Supabase client for inserting punches.
  supabase_flutter: ^2.5.0
  # Local offline queue.
  shared_preferences: ^2.2.0
  connectivity_plus: ^6.0.0
  # Reads the connected Wi-Fi SSID. Second presence signal: inside a steel
  # building GPS can read as "off site" while the person is standing in the
  # shop, and being joined to the shop network proves otherwise at no battery
  # cost. If this package ever breaks the build it can be removed — see
  # Presence.onShopWifi(), which fails soft to "no opinion".
  network_info_plus: ^5.0.0

dev_dependencies:
  # Generates the Android launcher icon (black PPC shield) at build time.
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Black PPC shield launcher icon. Regenerated in CI before the APK build.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
