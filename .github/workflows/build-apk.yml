name: Build Paragon Time Clock APK

# Run it from the Actions tab (the "Run workflow" button) or on every push.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Stash our app source
        run: |
          mkdir -p /tmp/appsrc
          cp -r lib pubspec.yaml assets /tmp/appsrc/

      - name: Scaffold the Android project
        run: |
          flutter create --platforms=android --org ca.paragonprotectivecoatings --project-name ppc_timeclock .

      - name: Restore our app source over the scaffold
        run: |
          rm -rf lib pubspec.yaml assets
          cp -r /tmp/appsrc/lib .
          cp -r /tmp/appsrc/assets .
          cp /tmp/appsrc/pubspec.yaml .

      - name: Add Android permissions to the manifest
        run: |
          python3 - <<'PY'
          import re, io
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = [
            "ACCESS_FINE_LOCATION","ACCESS_COARSE_LOCATION","ACCESS_BACKGROUND_LOCATION",
            "ACTIVITY_RECOGNITION","FOREGROUND_SERVICE","FOREGROUND_SERVICE_LOCATION",
            "RECEIVE_BOOT_COMPLETED","WAKE_LOCK","INTERNET",
            # Lets the app ASK to be exempted from Doze instead of someone
            # having to dig through Android settings on every crew phone.
            # Without it the in-app "Fix now" button cannot work.
            "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
            # Wi-Fi presence backup (network_info_plus).
            "ACCESS_WIFI_STATE","CHANGE_WIFI_STATE","ACCESS_NETWORK_STATE",
          ]
          block = "".join(f'    <uses-permission android:name="android.permission.{x}" />\n' for x in perms)
          if "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" not in s:
            s = re.sub(r"(<manifest[^>]*>\s*)", r"\1\n" + block, s, count=1)
          if "xmlns:tools" not in s:
            s = s.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if "tools:replace" not in s:
            s = re.sub(r"(<application\b)", r'\1 tools:replace="android:label"', s, count=1)
          # The launcher label was never set, so Flutter defaulted it to the
          # project name. Android showed the app as "ppc_timeclock" in every
          # settings screen — which made it effectively unfindable when hunting
          # through battery and notification menus looking for "Paragon".
          s = re.sub(r'android:label="[^"]*"', 'android:label="Paragon Time Clock"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print("manifest patched")
          PY

      - name: Configure Gradle for background geolocation
        run: |
          python3 - <<'PY'
          import os
          def repos(kts):
            if kts:
              return [
                'maven { url = uri("${project(":flutter_background_geolocation").projectDir}/libs") }',
                'maven { url = uri("https://developer.huawei.com/repo/") }',
                'maven { url = uri("${project(":background_fetch").projectDir}/libs") }',
              ]
            return [
              'maven { url "${project(\':flutter_background_geolocation\').projectDir}/libs" }',
              "maven { url 'https://developer.huawei.com/repo/' }",
              'maven { url "${project(\':background_fetch\').projectDir}/libs" }',
            ]
          def inject(f, anchor):
            s = open(f, encoding="utf-8").read()
            if "flutter_background_geolocation" in s: return
            if anchor not in s or "repositories {" not in s: return
            idx = s.index(anchor)
            ridx = s.index("repositories {", idx) + len("repositories {")
            s = s[:ridx] + "\n        " + "\n        ".join(repos(f.endswith(".kts"))) + s[ridx:]
            open(f, "w", encoding="utf-8").write(s)
            print("patched", f)
          for f in ["android/settings.gradle", "android/settings.gradle.kts"]:
            if os.path.exists(f): inject(f, "dependencyResolutionManagement")
          for f in ["android/build.gradle", "android/build.gradle.kts"]:
            if os.path.exists(f): inject(f, "allprojects")
          # minSdk 21 for the plugin
          for f in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
            if os.path.exists(f):
              s = open(f, encoding="utf-8").read()
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
              s = s.replace("minSdk flutter.minSdkVersion", "minSdk 21")
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              s = s.replace("compileSdk flutter.compileSdkVersion", "compileSdk 36")
              open(f, "w", encoding="utf-8").write(s)
              print("sdk versions set in", f)
          # Force EVERY Android subproject (incl. plugins like flutter_background_geolocation)
          # to compileSdk 36 — background_fetch requires its dependents to compile against 36.
          # NB: apply directly when the subproject is already evaluated (Flutter's root
          # script forces early evaluation via evaluationDependsOn), else afterEvaluate.
          kts_block = (
            "\n\nsubprojects {\n"
            "    val setSdk = fun(p: org.gradle.api.Project) {\n"
            "        val ext = p.extensions.findByName(\"android\")\n"
            "        if (ext != null) {\n"
            "            try {\n"
            "                ext.javaClass.getMethod(\"compileSdkVersion\", Int::class.javaPrimitiveType).invoke(ext, 36)\n"
            "            } catch (e: Exception) {\n"
            "                try {\n"
            "                    ext.javaClass.getMethod(\"setCompileSdk\", Integer::class.java).invoke(ext, 36)\n"
            "                } catch (e2: Exception) {}\n"
            "            }\n"
            "        }\n"
            "    }\n"
            "    if (state.executed) setSdk(project) else afterEvaluate { setSdk(project) }\n"
            "}\n"
          )
          gr_block = (
            "\n\nsubprojects {\n"
            "    def setSdk = { p ->\n"
            "        if (p.hasProperty(\"android\")) {\n"
            "            p.android {\n"
            "                compileSdkVersion 36\n"
            "            }\n"
            "        }\n"
            "    }\n"
            "    if (state.executed) { setSdk(project) } else { afterEvaluate { setSdk(it) } }\n"
            "}\n"
          )
          if os.path.exists("android/build.gradle.kts"):
            s = open("android/build.gradle.kts", encoding="utf-8").read()
            if "setSdk" not in s:
              open("android/build.gradle.kts", "a", encoding="utf-8").write(kts_block)
              print("appended subprojects compileSdk override to android/build.gradle.kts")
          elif os.path.exists("android/build.gradle"):
            s = open("android/build.gradle", encoding="utf-8").read()
            if "setSdk" not in s:
              open("android/build.gradle", "a", encoding="utf-8").write(gr_block)
              print("appended subprojects compileSdk override to android/build.gradle")
          PY

      - name: Get packages
        run: flutter pub get

      - name: Generate the launcher icon (black PPC shield)
        run: dart run flutter_launcher_icons

      # --split-per-abi builds one APK per CPU architecture instead of a single
      # fat one carrying all of them. The old combined debug APK was 161 MB,
      # most of which was machine code for chips the phone does not have.
      - name: Build APK (debug — installable, no keystore needed)
        run: flutter build apk --debug --split-per-abi

      # Name the outputs for humans. arm64 is every Android phone made since
      # roughly 2017 — that is the one crew install. v7a is kept only as a
      # fallback for genuinely old hardware.
      - name: Name the APKs for the crew
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          mkdir -p /tmp/out
          cp app-arm64-v8a-debug.apk   /tmp/out/PPC-TimeClock.apk
          if [ -f app-armeabi-v7a-debug.apk ]; then
            cp app-armeabi-v7a-debug.apk /tmp/out/PPC-TimeClock-old-phones.apk
          fi
          ls -la /tmp/out

      # ----------------------------------------------------------------------
      #  GEOFENCE REGRESSION TEST
      #
      #  Builds an x86_64 APK, runs it on an emulator, and drives the phone in
      #  and out of the shop zone with `adb emu geo fix`. Proves the fence
      #  fires without anyone holding a handset.
      #
      #  WHAT THIS CATCHES: a broken geofence registration, a wrong radius, the
      #  app failing to start, punches not reaching Supabase.
      #
      #  WHAT IT CANNOT CATCH: Doze, Samsung's app-killer, or a real phone
      #  deciding to shut the service down. An emulator is a friendly machine.
      #  A green run here means "the code is right", never "it will survive a
      #  real phone" — those are different claims and conflating them is how
      #  two evenings got lost.
      #
      #  Non-blocking on purpose: a flaky emulator must never stop the crew
      #  getting an APK.
      # ----------------------------------------------------------------------
      - name: Build x86_64 APK for the emulator
        continue-on-error: true
        run: flutter build apk --debug --target-platform android-x64

      - name: Enable KVM
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Geofence test on emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            adb install -r build/app/outputs/flutter-apk/app-debug.apk || \
              adb install -r build/app/outputs/flutter-apk/app-x86_64-debug.apk

            PKG=ca.paragonprotectivecoatings.ppc_timeclock
            # Grant up front — an emulator has nobody to tap the dialogs.
            for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION \
                     ACCESS_BACKGROUND_LOCATION POST_NOTIFICATIONS \
                     ACTIVITY_RECOGNITION; do
              adb shell pm grant $PKG android.permission.$P || true
            done

            # Start AT the shop, so the app's startup check should clock in.
            adb emu geo fix -113.357603 53.513522
            adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1 || true
            sleep 45
            echo "--- should be INSIDE the zone ---"
            adb logcat -d -s TSLocationManager | tail -40

            # Now drive out well past the 200 m exit radius.
            for STEP in 0.0010 0.0025 0.0050 0.0090; do
              adb emu geo fix -113.357603 $(python3 -c "print(53.513522 + $STEP)")
              sleep 12
            done
            sleep 30
            echo "--- should have EXITED the zone ---"
            adb logcat -d -s TSLocationManager | tail -60

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ppc-timeclock-apk
          path: /tmp/out/*.apk
          if-no-files-found: error
