name: Build Paragon Time Clock APK

# Run it from the Actions tab (the "Run workflow" button) or on every push.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Stash our app source
        run: |
          mkdir -p /tmp/appsrc
          cp -r lib pubspec.yaml assets /tmp/appsrc/

      - name: Scaffold the Android project
        run: |
          flutter create --platforms=android --org ca.paragonprotectivecoatings --project-name ppc_timeclock .

      - name: Restore our app source over the scaffold
        run: |
          rm -rf lib pubspec.yaml assets
          cp -r /tmp/appsrc/lib .
          cp -r /tmp/appsrc/assets .
          cp /tmp/appsrc/pubspec.yaml .

      # -----------------------------------------------------------------------
      #  MANIFEST
      #
      #  Two jobs here. The permissions block, and — new and load-bearing — the
      #  three native_geofence components.
      #
      #  Those three ARE the new architecture. The broadcast receiver is the
      #  address Android delivers a fence crossing to; without it registered in
      #  the manifest the OS has nowhere to send the event and the app is never
      #  started. The reboot receiver re-arms the fences after a restart, since
      #  Android does not keep them across boots. The foreground service is what
      #  the callback promotes itself to so it has time to write the punch to
      #  Supabase.
      #
      #  Miss any of these and the build succeeds, the app installs, the
      #  checklist looks green, and no punch is ever recorded. Verified below.
      # -----------------------------------------------------------------------
      - name: Patch the AndroidManifest
        run: |
          python3 - <<'PY'
          import re, sys
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()

          perms = [
            # Required by native_geofence to create a fence at all.
            "ACCESS_FINE_LOCATION","ACCESS_COARSE_LOCATION","ACCESS_BACKGROUND_LOCATION",
            # Re-register fences after a reboot.
            "RECEIVE_BOOT_COMPLETED",
            # Only needed because the callback promotes to a foreground service.
            "WAKE_LOCK","FOREGROUND_SERVICE","FOREGROUND_SERVICE_LOCATION",
            "POST_NOTIFICATIONS",
            "INTERNET",
            # Lets the app ASK to be exempted from Doze instead of someone
            # having to dig through Android settings on every crew phone.
            "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
            # Wi-Fi presence backup (network_info_plus).
            "ACCESS_WIFI_STATE","CHANGE_WIFI_STATE","ACCESS_NETWORK_STATE",
          ]
          block = "".join(
            f'    <uses-permission android:name="android.permission.{x}" />\n'
            for x in perms)
          if "ACCESS_BACKGROUND_LOCATION" not in s:
            s = re.sub(r"(<manifest[^>]*>\s*)", r"\1\n" + block, s, count=1)

          if "xmlns:tools" not in s:
            s = s.replace("<manifest ",
                          '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if "tools:replace" not in s:
            s = re.sub(r"(<application\b)", r'\1 tools:replace="android:label"', s, count=1)

          # The launcher label was never set, so Flutter defaulted it to the
          # project name and Android showed the app as "ppc_timeclock" in every
          # settings screen — unfindable when hunting for "Paragon".
          s = re.sub(r'android:label="[^"]*"', 'android:label="Paragon Time Clock"',
                     s, count=1)

          # Built as a joined list rather than a triple-quoted literal on
          # purpose: every line inside a YAML "run: |" block must stay indented
          # past the block's own margin, and a multi-line Python string with
          # XML at column 4 silently terminates the block. That is exactly how
          # this file broke on the first push.
          R = "com.chunkytofustudios.native_geofence.receivers"
          S = "com.chunkytofustudios.native_geofence"
          NG = "\n".join([
            "",
            "    <!-- native_geofence: the OS delivers fence crossings here, and this starts the app. -->",
            f'    <receiver android:name="{R}.NativeGeofenceBroadcastReceiver"',
            '              android:exported="true"/>',
            "    <!-- native_geofence: Android drops geofences on reboot; this re-registers them. -->",
            f'    <receiver android:name="{R}.NativeGeofenceRebootBroadcastReceiver"',
            '              android:exported="true">',
            "        <intent-filter>",
            '            <action android:name="android.intent.action.BOOT_COMPLETED"/>',
            "        </intent-filter>",
            "    </receiver>",
            "    <!-- native_geofence: foreground service used when a callback needs longer.",
            "         foregroundServiceType is NOT optional on Android 14+. Without it the",
            "         system refuses to start the service and kills the process — which is",
            "         exactly what 'Paragon Time Clock keeps stopping' was on 29 July, every",
            "         time a geofence fired. Our callback no longer asks to be promoted, but",
            "         the type is declared so the package can never take the app down. -->",
            f'    <service android:name="{S}.NativeGeofenceForegroundService"',
            '             android:permission="android.permission.BIND_JOB_SERVICE"',
            '             android:foregroundServiceType="location"',
            '             android:exported="true"/>',
            "",
          ])
          if "NativeGeofenceBroadcastReceiver" not in s:
            s = s.replace("</application>", NG + "    </application>", 1)

          open(p, "w", encoding="utf-8").write(s)

          # Verify, don't assume. A missing receiver produces a perfectly green
          # build and a clock that never fires — exactly the failure mode this
          # rebuild exists to eliminate.
          check = open(p, encoding="utf-8").read()
          required = [
            "NativeGeofenceBroadcastReceiver",
            "NativeGeofenceRebootBroadcastReceiver",
            "NativeGeofenceForegroundService",
            "ACCESS_BACKGROUND_LOCATION",
            "RECEIVE_BOOT_COMPLETED",
          ]
          missing = [r for r in required if r not in check]
          if missing:
            sys.exit("MANIFEST PATCH FAILED, missing: " + ", ".join(missing))
          print("manifest patched and verified")
          PY

      # -----------------------------------------------------------------------
      #  MAINACTIVITY — the Wi-Fi scanning button
      #
      #  Android's geofencing does not use GPS. It positions the phone by
      #  SCANNING for nearby Wi-Fi names and matching that pattern against
      #  Google's database — it never joins a network. The setting that governs
      #  it is Settings > Location > Wi-Fi scanning, and with it off the fence
      #  can go blind while every row on the setup screen sits there green.
      #
      #  There is no Flutter package for this, so the native half is written
      #  here. It has to be a build step rather than a checked-in file because
      #  `flutter create` regenerates android/ on EVERY build — the same reason
      #  the clock-in sound is copied in below. Anything placed there by hand
      #  disappears without a word.
      #
      #  Two methods over one channel:
      #    requestScanning      ACTION_REQUEST_SCAN_ALWAYS_AVAILABLE — API 18,
      #                         still supported. Shows Android's own dialog and
      #                         reports RESULT_OK. This is the one tap.
      #    isScanningOn         isScanAlwaysAvailable() — DEPRECATED in API 29.
      #                         Kept because a real answer is better than none,
      #                         but the Dart side treats null as "don't know"
      #                         and never paints a status it cannot stand behind.
      #
      #  Nothing here touches the punch path. Worst case is a button that opens
      #  the wrong settings page.
      # -----------------------------------------------------------------------
      - name: Write MainActivity (Wi-Fi scanning channel)
        run: |
          python3 - <<'PY'
          import glob, os, re, sys

          hits = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt",
                           recursive=True)
          if not hits:
            # Fail loudly. A silent skip here builds an APK whose button throws
            # MissingPluginException on a crew phone, and the Dart fallback
            # would quietly hide it — so the only place this can be caught is
            # right here.
            sys.exit("MainActivity.kt not found under android/app/src/main/kotlin")
          path = hits[0]

          # Keep whatever package the scaffold chose rather than hardcoding it.
          # The --org flag above decides this, and if it is ever changed a
          # hardcoded package would not fail to compile — it would compile into
          # the wrong class and the channel would simply never answer.
          src = open(path, encoding="utf-8").read()
          m = re.search(r"^package\s+([\w.]+)", src, re.M)
          if not m:
            sys.exit("no package declaration in " + path)
          pkg = m.group(1)
          print("patching", path, "package", pkg)

          KT = """package __PKG__

          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Context
          import android.content.Intent
          import android.net.wifi.WifiManager
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          /**
           * Wi-Fi scanning is the setting Android geofencing actually depends on.
           * Generated by the build workflow - see the step that writes this file.
           */
          class MainActivity : FlutterActivity() {

              private val channelName = "ca.paragonprotectivecoatings/wifi_scanning"
              private val reqScanning = 8801

              // Held between startActivityForResult and onActivityResult. Only one
              // dialog can be open at a time, so a single slot is enough.
              private var pending: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "isScanningOn" -> result.success(scanningOn())
                              "requestScanning" -> requestScanning(result)
                              "openLocationSettings" -> result.success(openLocationSettings())
                              else -> result.notImplemented()
                          }
                      }
              }

              /** null means "cannot tell" - the Dart side must not guess from it. */
              private fun scanningOn(): Boolean? {
                  return try {
                      val wm = applicationContext
                          .getSystemService(Context.WIFI_SERVICE) as WifiManager
                      @Suppress("DEPRECATION")
                      wm.isScanAlwaysAvailable
                  } catch (e: Throwable) {
                      null
                  }
              }

              private fun requestScanning(result: MethodChannel.Result) {
                  if (pending != null) {
                      // A dialog is already up. Answer this one rather than
                      // stranding it forever waiting on a result that will be
                      // delivered to the first caller.
                      result.success(null)
                      return
                  }
                  try {
                      pending = result
                      startActivityForResult(
                          Intent(WifiManager.ACTION_REQUEST_SCAN_ALWAYS_AVAILABLE),
                          reqScanning)
                  } catch (e: ActivityNotFoundException) {
                      // Some manufacturers ship Android without this system
                      // activity. null tells Dart to fall back to settings.
                      pending = null
                      result.success(null)
                  } catch (e: Throwable) {
                      pending = null
                      result.success(null)
                  }
              }

              private fun openLocationSettings(): Boolean {
                  return try {
                      startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS))
                      true
                  } catch (e: Throwable) {
                      false
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqScanning) {
                      val r = pending
                      pending = null
                      r?.success(resultCode == Activity.RESULT_OK)
                  }
              }
          }
          """

          # Written out as-is. The Kotlin carries whatever leading whitespace the
          # YAML block left on it, which Kotlin does not care about - and trying
          # to "tidy" that up is a moving part with nothing to gain. Every line
          # above stays indented past the run-block margin on purpose: a line at
          # column 0 silently terminates the block, which is exactly how the
          # manifest step broke on the first push.
          out = KT.replace("__PKG__", pkg)
          open(path, "w", encoding="utf-8").write(out)

          # Verify, don't assume. Same discipline as the manifest check: this
          # compiles or the build stops, rather than shipping a dead button.
          check = open(path, encoding="utf-8").read()
          for token in ["package " + pkg,
                        "ACTION_REQUEST_SCAN_ALWAYS_AVAILABLE",
                        "ca.paragonprotectivecoatings/wifi_scanning",
                        "onActivityResult"]:
            if token not in check:
              sys.exit("MainActivity patch failed, missing: " + token)
          print("MainActivity written and verified")
          PY

      # -----------------------------------------------------------------------
      #  GRADLE
      #
      #  native_geofence requires Kotlin 1.9.25+, Gradle 8+ and minSdk 23.
      #  The Kotlin bump is version-aware: newer Flutter scaffolds already ship
      #  2.x and forcing 1.9.25 would be a downgrade.
      # -----------------------------------------------------------------------
      - name: Configure Gradle
        run: |
          python3 - <<'PY'
          import os, re, sys

          MIN_KOTLIN = (1, 9, 25)

          def ver(t):
            parts = (list(map(int, t.split("."))) + [0, 0])[:3]
            return tuple(parts)

          def bump_kotlin(f):
            if not os.path.exists(f): return
            s = open(f, encoding="utf-8").read()
            out, changed = s, False
            for m in re.finditer(
                r'(org\.jetbrains\.kotlin\.android["\']?\)?\s+version\s+["\'])([0-9.]+)(["\'])', s):
              if ver(m.group(2)) < MIN_KOTLIN:
                out = out.replace(m.group(0), m.group(1) + "1.9.25" + m.group(3))
                changed = True
            for m in re.finditer(r'(ext\.kotlin_version\s*=\s*["\'])([0-9.]+)(["\'])', s):
              if ver(m.group(2)) < MIN_KOTLIN:
                out = out.replace(m.group(0), m.group(1) + "1.9.25" + m.group(3))
                changed = True
            if changed:
              open(f, "w", encoding="utf-8").write(out)
              print("kotlin bumped to 1.9.25 in", f)

          for f in ["android/settings.gradle", "android/settings.gradle.kts",
                    "android/build.gradle", "android/build.gradle.kts"]:
            bump_kotlin(f)

          # background_fetch ships its Android library in a local maven folder.
          # (The flutter_background_geolocation repos that used to be here are
          # gone with the plugin — that engine is what we replaced.)
          def repos(kts):
            if kts:
              return ['maven { url = uri("${project(":background_fetch").projectDir}/libs") }']
            return ['maven { url "${project(\':background_fetch\').projectDir}/libs" }']

          def inject(f, anchor):
            s = open(f, encoding="utf-8").read()
            if "background_fetch" in s: return
            if anchor not in s or "repositories {" not in s: return
            idx = s.index(anchor)
            ridx = s.index("repositories {", idx) + len("repositories {")
            s = s[:ridx] + "\n        " + "\n        ".join(repos(f.endswith(".kts"))) + s[ridx:]
            open(f, "w", encoding="utf-8").write(s)
            print("patched", f)

          for f in ["android/settings.gradle", "android/settings.gradle.kts"]:
            if os.path.exists(f): inject(f, "dependencyResolutionManagement")
          for f in ["android/build.gradle", "android/build.gradle.kts"]:
            if os.path.exists(f): inject(f, "allprojects")

          # minSdk 23 — native_geofence's floor, up from the 21 the old plugin
          # allowed. Android API 23 is 2015 hardware; nothing in the shop is
          # near that.
          for f in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
            if os.path.exists(f):
              s = open(f, encoding="utf-8").read()
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              s = s.replace("minSdk flutter.minSdkVersion", "minSdk 23")
              s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              s = s.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              s = s.replace("compileSdk flutter.compileSdkVersion", "compileSdk 36")
              open(f, "w", encoding="utf-8").write(s)
              print("sdk versions set in", f)

          # Force EVERY Android subproject to compileSdk 36 — background_fetch
          # requires its dependents to compile against 36. Apply directly when
          # the subproject is already evaluated (Flutter's root script forces
          # early evaluation), else afterEvaluate.
          kts_block = (
            "\n\nsubprojects {\n"
            "    val setSdk = fun(p: org.gradle.api.Project) {\n"
            "        val ext = p.extensions.findByName(\"android\")\n"
            "        if (ext != null) {\n"
            "            try {\n"
            "                ext.javaClass.getMethod(\"compileSdkVersion\", Int::class.javaPrimitiveType).invoke(ext, 36)\n"
            "            } catch (e: Exception) {\n"
            "                try {\n"
            "                    ext.javaClass.getMethod(\"setCompileSdk\", Integer::class.java).invoke(ext, 36)\n"
            "                } catch (e2: Exception) {}\n"
            "            }\n"
            "        }\n"
            "    }\n"
            "    if (state.executed) setSdk(project) else afterEvaluate { setSdk(project) }\n"
            "}\n"
          )
          gr_block = (
            "\n\nsubprojects {\n"
            "    def setSdk = { p ->\n"
            "        if (p.hasProperty(\"android\")) {\n"
            "            p.android {\n"
            "                compileSdkVersion 36\n"
            "            }\n"
            "        }\n"
            "    }\n"
            "    if (state.executed) { setSdk(project) } else { afterEvaluate { setSdk(it) } }\n"
            "}\n"
          )
          if os.path.exists("android/build.gradle.kts"):
            s = open("android/build.gradle.kts", encoding="utf-8").read()
            if "setSdk" not in s:
              open("android/build.gradle.kts", "a", encoding="utf-8").write(kts_block)
              print("appended subprojects compileSdk override (kts)")
          elif os.path.exists("android/build.gradle"):
            s = open("android/build.gradle", encoding="utf-8").read()
            if "setSdk" not in s:
              open("android/build.gradle", "a", encoding="utf-8").write(gr_block)
              print("appended subprojects compileSdk override (groovy)")

          # CORE LIBRARY DESUGARING — currently NOT applied, deliberately.
          #
          # This block existed for flutter_local_notifications, which requires
          # desugaring and fails at :app:checkDebugAarMetadata without it. That
          # package was removed the same night (see lib/notify.dart), and this
          # is left switched off rather than deleted, because the next person to
          # add a package needing desugaring will want it — along with the part
          # that cost a build: pinning Java WITHOUT pinning Kotlin to match puts
          # compileDebugJavaWithJavac and compileDebugKotlin on different JVM
          # targets and the build dies. Set both, or set neither.
          #
          # To re-enable: flip APPLY_DESUGARING to True.
          APPLY_DESUGARING = True
          # Java AND Kotlin both pinned to 17, together.
          #
          # The first attempt set only the Java side, to 11, and the build died
          # with "Inconsistent JVM-target compatibility detected for tasks
          # compileDebugJavaWithJavac (11) and compileDebugKotlin (17)". The
          # Flutter scaffold's Kotlin was already on 17; hardcoding Java to 11
          # underneath it created a mismatch that did not exist before we
          # touched anything.
          #
          # Lesson worth keeping: when you append a config block, you are not
          # only adding your setting — you are overriding whatever was there.
          # Set both halves of a matched pair, or set neither.
          # MINIMAL ON PURPOSE. Enable the flag, add the library, touch nothing
          # else. Two builds were lost learning why:
          #
          #   #58  the block also pinned sourceCompatibility/targetCompatibility
          #        to Java 11. The Flutter scaffold is already on 17 for BOTH
          #        Java and Kotlin, so this did not "set" anything — it
          #        OVERRODE the Java half and left Kotlin at 17, producing
          #        "Inconsistent JVM-target compatibility ... (11) and (17)".
          #        The mismatch did not exist until we introduced it.
          #
          #   #59  the block then also added a kotlinOptions{} section. Inside
          #        a SECOND android{} block appended to the end of the script,
          #        that fails to resolve and the build dies during Gradle
          #        configuration — which is why it failed in under three
          #        minutes rather than during compilation.
          #
          # The lesson both times: an appended config block does not add to what
          # is there, it replaces it. Change only what actually needs changing.
          desugar_kts = (
            "\n\nandroid {\n"
            "    compileOptions {\n"
            "        isCoreLibraryDesugaringEnabled = true\n"
            "    }\n"
            "}\n\n"
            "dependencies {\n"
            "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n"
            "}\n"
          )
          desugar_groovy = (
            "\n\nandroid {\n"
            "    compileOptions {\n"
            "        coreLibraryDesugaringEnabled true\n"
            "    }\n"
            "}\n\n"
            "dependencies {\n"
            "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"
            "}\n"
          )
          if APPLY_DESUGARING:
            if os.path.exists("android/app/build.gradle.kts"):
              s = open("android/app/build.gradle.kts", encoding="utf-8").read()
              if "coreLibraryDesugaring" not in s:
                open("android/app/build.gradle.kts", "a", encoding="utf-8").write(desugar_kts)
                print("enabled core library desugaring (kts)")
            elif os.path.exists("android/app/build.gradle"):
              s = open("android/app/build.gradle", encoding="utf-8").read()
              if "coreLibraryDesugaring" not in s:
                open("android/app/build.gradle", "a", encoding="utf-8").write(desugar_groovy)
                print("enabled core library desugaring (groovy)")
          else:
            print("core library desugaring not needed, skipping")

          # Gradle 8+ is a native_geofence requirement. Report it rather than
          # silently building something that will fail obscurely later.
          wp = "android/gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(wp):
            w = open(wp, encoding="utf-8").read()
            m = re.search(r"gradle-([0-9.]+)-", w)
            if m:
              print("gradle wrapper version:", m.group(1))
              if ver(m.group(1))[0] < 8:
                sys.exit("Gradle 8+ required by native_geofence, found " + m.group(1))
          PY

      # -----------------------------------------------------------------------
      #  RELEASE SIGNING
      #
      #  THE PROBLEM THIS SOLVES
      #  A debug APK is signed with a keystore the build machine generates for
      #  itself. Every GitHub run is a fresh machine, so every build has been
      #  signed with a DIFFERENT throwaway key. Android refuses to update an app
      #  when the signature changes — that is the "app not updated" message —
      #  so every new build has meant uninstall, reinstall, and pick your name
      #  again. Fine for one person testing. Impossible for a crew.
      #
      #  Uninstalling also wipes the device token, so the person then gets
      #  "this phone is not registered" and an admin has to reset it. One
      #  signing key removes that entire sequence, permanently.
      #
      #  IF THE SECRETS ARE NOT SET, THIS STEP DOES NOTHING and the build falls
      #  back to debug signing exactly as before. That is deliberate: adding
      #  this must not be able to break a build for somebody who has not set the
      #  secrets up yet.
      #
      #  See SIGNING-KEY-SETUP.md for how to create the key. It is Kent's to
      #  create and Kent's to paste into GitHub — a signing key is the identity
      #  of the app and nobody else should ever hold it.
      # -----------------------------------------------------------------------
      # NOTE ON WHY THERE IS NO `if:` ON THIS STEP.
      # The obvious version is `if: secrets.ANDROID_KEYSTORE_BASE64 != ''`.
      # GitHub does not allow it: the `secrets` context is not among those
      # available to a step's `if`, so that condition does not do what it
      # reads like. The check therefore lives inside the script, where the
      # secret arrives as an ordinary environment variable.
      - name: Install the release signing key
        env:
          KEYSTORE_B64:  ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}

        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing key configured — building with a throwaway debug key."
            echo "Crew will have to uninstall before installing this build."
            echo "See SIGNING-KEY-SETUP.md to fix that permanently."
            exit 0
          fi
          for v in STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "$(eval echo \$$v)" ]; then
              echo "ANDROID_KEYSTORE_BASE64 is set but $v is missing."
              echo "All four secrets are needed. Stopping rather than shipping"
              echo "an APK signed with the wrong key."
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 -d > android/app/ppc-release.jks
          # Never echo the file or the passwords. Size alone proves it decoded.
          ls -l android/app/ppc-release.jks

          python3 - <<'PY'
          import os, re, sys

          # Flutter's scaffold is Kotlin DSL on current versions, Groovy on
          # older ones. Handle whichever we were given rather than assuming.
          kts = "android/app/build.gradle.kts"
          gr  = "android/app/build.gradle"
          path = kts if os.path.exists(kts) else gr
          s = open(path, encoding="utf-8").read()

          if "ppcRelease" in s:
              print("already configured"); sys.exit(0)

          # APPEND ONLY. NOTHING GOES ABOVE THE EXISTING SCRIPT.
          #
          # The first version of this put the Properties-loading lines at the
          # TOP of build.gradle.kts. Build #83 died immediately:
          #
          #   e: build.gradle.kts:1:21: Unresolved reference 'util'.
          #   e: build.gradle.kts:3:47: Unresolved reference 'io'.
          #
          # In the Gradle Kotlin DSL the `plugins { }` block must come first;
          # anything before it and the script does not compile, which is why
          # even `java.util` could not resolve. The properties are therefore
          # loaded INSIDE the signing config, in an appended block — the same
          # shape as the desugaring block further up this file, which has been
          # appending an android { } block successfully for weeks.
          # ENVIRONMENT VARIABLES, NOT A PROPERTIES FILE.
          #
          # Two builds were lost trying to read key.properties from the Kotlin
          # DSL. First at the top of the script (#83 — nothing may precede the
          # plugins block), then inside the signingConfigs lambda (#84):
          #
          #   build.gradle.kts:66:33: Unresolved reference 'util'.
          #   build.gradle.kts:69:39: Cannot infer type for type parameter 'R'.
          #
          # The Kotlin DSL does not resolve java.util there, and .use{} cannot
          # infer its type. Both are fixable with enough import wrangling, and
          # none of it is worth it — the values are already secrets in the
          # environment, so read them from there.
          #
          # System.getenv needs no import in any Gradle script, Kotlin or
          # Groovy. There is no file to parse, nothing to leave lying on disk,
          # and the same four lines work in both dialects.
          if path.endswith(".kts"):
              block = (
                '\n\nandroid {\n'
                '    signingConfigs {\n'
                '        create("ppcRelease") {\n'
                '            storeFile = file(System.getenv("PPC_STORE_FILE") ?: "ppc-release.jks")\n'
                '            storePassword = System.getenv("PPC_STORE_PASSWORD")\n'
                '            keyAlias = System.getenv("PPC_KEY_ALIAS")\n'
                '            keyPassword = System.getenv("PPC_KEY_PASSWORD")\n'
                '        }\n'
                '    }\n'
                '    buildTypes {\n'
                '        getByName("release") {\n'
                '            signingConfig = signingConfigs.getByName("ppcRelease")\n'
                '        }\n'
                '        // The crew install a DEBUG apk (no keystore needed to\n'
                '        // build one). Signing it with the release key is what\n'
                '        // makes updates work without switching the whole\n'
                '        // pipeline to release builds.\n'
                '        getByName("debug") {\n'
                '            signingConfig = signingConfigs.getByName("ppcRelease")\n'
                '        }\n'
                '    }\n'
                '}\n'
              )
          else:
              block = (
                '\n\nandroid {\n'
                '    signingConfigs {\n'
                '        ppcRelease {\n'
                '            storeFile file(System.getenv("PPC_STORE_FILE") ?: "ppc-release.jks")\n'
                '            storePassword System.getenv("PPC_STORE_PASSWORD")\n'
                '            keyAlias System.getenv("PPC_KEY_ALIAS")\n'
                '            keyPassword System.getenv("PPC_KEY_PASSWORD")\n'
                '        }\n'
                '    }\n'
                '    buildTypes {\n'
                '        release { signingConfig signingConfigs.ppcRelease }\n'
                '        debug   { signingConfig signingConfigs.ppcRelease }\n'
                '    }\n'
                '}\n'
              )

          open(path, "a", encoding="utf-8").write(block)
          print("release signing wired into", path)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Generate the launcher icon (black PPC shield)
        run: dart run flutter_launcher_icons

      # The clock-in / clock-out sound.
      #
      # Android notification sounds are ANDROID RESOURCES, not Flutter assets —
      # the system plays them from its own process, long after our isolate is
      # gone, so it cannot reach into the Flutter asset bundle. The file has to
      # land in res/raw/ and be referenced by bare name, no extension.
      #
      # This step exists because `flutter create` regenerates android/ on every
      # single build. Anything dropped in there by hand disappears. The one
      # copy of the sound lives in assets/sound/ with the rest of the source,
      # and is copied into the generated tree here.
      - name: Install the clock-in sound as an Android resource
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/sound/kaching.wav android/app/src/main/res/raw/kaching.wav
          ls -l android/app/src/main/res/raw/

      # Static analysis before we spend ten minutes on a build. Catches the
      # class of error that cost builds #30-32 — a name collision between our
      # classes and a package's exports — in about fifteen seconds.
      #
      # The generated analysis_options.yaml is deleted first. `flutter create`
      # writes one that pulls in flutter_lints, but our pubspec.yaml overwrites
      # the generated one and does not list flutter_lints, so the include would
      # fail to resolve and the step would fail for a reason that has nothing
      # to do with our code.
      #
      # Errors only. Style warnings must never stand between the crew and a
      # working time clock.
      #
      # test/ goes too. `flutter create` writes a widget_test.dart that imports
      # flutter_test and references a MyApp class — neither of which exists in
      # this project, since we replace the whole scaffold. Nineteen of the
      # twenty issues in the first run came from that one generated file.
      - name: Analyse
        run: |
          rm -f analysis_options.yaml
          rm -rf test
          flutter analyze --no-fatal-infos --no-fatal-warnings

      # --split-per-abi builds one APK per CPU architecture instead of a single
      # fat one carrying all of them. The old combined debug APK was 161 MB,
      # most of which was machine code for chips the phone does not have.
      # The signing values are read by build.gradle with System.getenv, so they
      # have to be present HERE, on the step that actually runs Gradle. If the
      # secrets are unset these are empty, the signing config gets nulls, and
      # Gradle falls back to the debug key exactly as it always did.
      - name: Build APK (debug — installable, no keystore needed)
        env:
          PPC_STORE_FILE:     ppc-release.jks
          PPC_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PPC_KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          PPC_KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --debug --split-per-abi

      # Prove the geofence machinery actually made it into the shipped binary.
      # A build can succeed with the manifest patch silently skipped.
      - name: Verify the built APK contains the geofence receivers
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          # aapt2 gives a readable tree. If it isn't on the runner, fall back to
          # pulling the strings straight out of the binary manifest — component
          # names survive as plain text in the string pool either way. The point
          # is to never skip this check just because a tool moved.
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt
          else
            echo "aapt2 not found, reading the binary manifest directly"
            unzip -p "$APK" AndroidManifest.xml | strings > /tmp/manifest.txt
          fi
          FAILED=0
          for NAME in NativeGeofenceBroadcastReceiver \
                      NativeGeofenceRebootBroadcastReceiver \
                      NativeGeofenceForegroundService \
                      ACCESS_BACKGROUND_LOCATION \
                      RECEIVE_BOOT_COMPLETED; do
            if grep -q "$NAME" /tmp/manifest.txt; then
              echo "OK   $NAME"
            else
              echo "FAIL $NAME is missing from the built APK"
              FAILED=1
            fi
          done
          # Report every failure, then stop. Fixing one and rebuilding ten
          # minutes later only to hit the next one is how evenings disappear.
          exit $FAILED

      # Name the outputs for humans. arm64 is every Android phone made since
      # roughly 2017 — that is the one crew install. v7a is kept only as a
      # fallback for genuinely old hardware.
      - name: Name the APKs for the crew
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          mkdir -p /tmp/out
          cp app-arm64-v8a-debug.apk   /tmp/out/PPC-TimeClock.apk
          if [ -f app-armeabi-v7a-debug.apk ]; then
            cp app-armeabi-v7a-debug.apk /tmp/out/PPC-TimeClock-old-phones.apk
          fi
          ls -la /tmp/out

      # ----------------------------------------------------------------------
      #  NOTE ON THE EMULATOR GEOFENCE TEST — REMOVED, DELIBERATELY.
      #
      #  The emulator step that used to live here has been deleted rather than
      #  left running, because under this architecture it cannot tell the truth.
      #  From native_geofence's own documented known issues:
      #
      #    "Android: The emulator does not trigger geofence events if there are
      #     no apps accessing the device location."
      #
      #  So a green run would have proved nothing and a red run would have meant
      #  nothing — and a test that can only mislead is worse than no test. This
      #  is the same mistake as reading `enabled=true` off a config object and
      #  calling it proof the service was running.
      #
      #  The manifest verification above is the real automated check: it proves
      #  the OS has somewhere to deliver a crossing to. Whether a crossing
      #  actually fires is verified on a real phone with Lockito, driving a
      #  route rather than dropping a static pin — see VERIFY-ON-PHONE.md.
      # ----------------------------------------------------------------------

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ppc-timeclock-apk
          path: /tmp/out/*.apk
          if-no-files-found: error
